name: Quint

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quint:
    name: Quint gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Quint changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "quint=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '\.qnt$'; then
            echo "quint=true" >> "$GITHUB_OUTPUT"
          else
            echo "quint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.quint == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        if: steps.changes.outputs.quint == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Typecheck Quint spec
        if: steps.changes.outputs.quint == 'true'
        run: nix run .#quint -- typecheck spec/mutation_cursor.qnt

      - name: Run Quint tests
        if: steps.changes.outputs.quint == 'true'
        run: nix run .#quint -- test spec/mutation_cursor.qnt

      - name: Verify Quint safety invariant
        if: steps.changes.outputs.quint == 'true'
        run: nix run .#quint -- verify spec/mutation_cursor.qnt --invariant=Safety

      - name: No Quint changes
        if: steps.changes.outputs.quint != 'true'
        run: echo "No Quint specification changes detected; validation skipped."
