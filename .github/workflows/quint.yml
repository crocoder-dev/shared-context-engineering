name: Quint

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Quint changes
    runs-on: ubuntu-latest
    outputs:
      quint: ${{ steps.changes.outputs.quint }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Quint changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "quint=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '\.qnt$'; then
            echo "quint=true" >> "$GITHUB_OUTPUT"
          else
            echo "quint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Quint changes
        if: steps.changes.outputs.quint != 'true'
        run: echo "No Quint specification changes detected; validation skipped."

  quint:
    name: Quint checks
    needs: detect
    if: needs.detect.outputs.quint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Typecheck Quint spec
        run: nix run .#quint -- typecheck spec/mutation_cursor.qnt

      - name: Run Quint tests
        run: nix run .#quint -- test spec/mutation_cursor.qnt

  quint-verify:
    name: Verify Quint safety invariant (${{ matrix.invariant }})
    needs: detect
    if: needs.detect.outputs.quint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # SafetyHistory does nested forall/exists over history logs that grow
        # every step, so its BMC cost blows up with trace depth (this is what
        # timed out the single combined Safety invariant at step 4). It gets
        # a shorter trace bound; the cheaper groups keep the full default depth.
        include:
          - invariant: SafetyCore
            max_steps: 10
          - invariant: SafetyAttribution
            max_steps: 8
          - invariant: SafetyHistory
            max_steps: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Verify ${{ matrix.invariant }}
        run: nix run .#quint -- verify spec/mutation_cursor.qnt --invariant=${{ matrix.invariant }} --max-steps=${{ matrix.max_steps }}

  gate:
    name: Quint gate
    if: always()
    needs:
      - detect
      - quint
      - quint-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check Quint result
        env:
          CHANGED: ${{ needs.detect.outputs.quint }}
          CHECK_RESULT: ${{ needs.quint.result }}
          VERIFY_RESULT: ${{ needs.quint-verify.result }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "No Quint changes."
            exit 0
          fi

          if [ "$CHECK_RESULT" != "success" ]; then
            echo "Quint typecheck/tests failed."
            exit 1
          fi

          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Quint safety verification failed."
            exit 1
          fi
