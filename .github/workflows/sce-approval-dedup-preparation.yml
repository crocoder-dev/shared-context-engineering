name: Prepare validation report deduplication

on:
  push:
    branches:
      - codex/compress-workflow-execution-preamble
    paths:
      - .sce-validation-report-dedup.py
      - .github/workflows/sce-approval-dedup-preparation.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25

      - name: Apply, verify, commit, and push validation report deduplication
        run: |
          cp .sce-validation-report-dedup.py /tmp/sce-validation-report-dedup.py
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#pkl -c python3 /tmp/sce-validation-report-dedup.py
