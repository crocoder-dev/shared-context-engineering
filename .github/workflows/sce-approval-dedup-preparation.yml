name: Prepare approval gate deduplication

on:
  push:
    branches:
      - codex/compress-workflow-execution-preamble
    paths:
      - .sce-clean-pr-history.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Rewrite PR branch to two implementation commits
        run: python3 .sce-clean-pr-history.py
