name: Deploy config schema

on:
  push:
    branches:
      - main
    paths:
      - config/pkl/**
      - .github/workflows/deploy-config-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-config-schema
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy config schema to config.sce.crocoder.dev
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VERCEL_CLI_VERSION: 58.7.1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Ensure Vercel deployment secrets are configured
        shell: bash
        run: |
          set -euo pipefail

          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            printf 'Missing required repository secret(s):%s\n' "$missing" >&2
            exit 1
          fi

      - name: Generate the canonical config schema
        shell: bash
        run: |
          set -euo pipefail

          generated_dir="$(mktemp -d)"
          time nix run .#pkl-generate -- "$generated_dir"

          schema="${generated_dir}/config/schema/sce-config.schema.json"
          if [ ! -f "$schema" ]; then
            printf 'Expected generated schema at %s\n' "$schema" >&2
            exit 1
          fi

          staging_dir="${RUNNER_TEMP}/config-schema-site"
          mkdir -p "$staging_dir"
          cp "$schema" "${staging_dir}/config.json"

          cat > "${staging_dir}/vercel.json" <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "rewrites": [
              {
                "source": "/",
                "destination": "/config.json"
              }
            ]
          }
          EOF

          printf 'STAGING_DIR=%s\n' "$staging_dir" >> "$GITHUB_ENV"

      - name: Deploy the schema to Vercel
        shell: bash
        run: |
          set -euo pipefail

          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy "$STAGING_DIR" \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"
