name: Nix CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-ci:
    name: Nix CI (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Run flake checks
        run: |
          start="$SECONDS"
          nix flake check --fallback --print-build-logs
          elapsed="$((SECONDS - start))"
          printf 'Nix flake check: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"

      # On macOS release validation builds the same native CLI dependency
      # closure, so run its smoke test there rather than building it twice.
      - name: Build and smoke-test native CLI
        if: matrix.os == 'ubuntu-latest'
        run: |
          start="$SECONDS"
          nix build .#sce --fallback --out-link result --print-build-logs
          ./result/bin/sce --help
          ./result/bin/sce version
          elapsed="$((SECONDS - start))"
          printf 'Native CLI build + smoke: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"

  release-validation:
    name: Release validation (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build release package and audit portability
        run: |
          start="$SECONDS"
          nix build .#ci-checks --fallback --out-link result-ci-checks --print-build-logs
          elapsed="$((SECONDS - start))"
          printf 'Release validation: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"

      # On Darwin, .#sce-release is the native CLI with commit metadata.
      # Smoke-test that exact binary, which is already built by .#ci-checks.
      - name: Smoke-test macOS release CLI
        if: matrix.os == 'macos-latest'
        run: |
          start="$SECONDS"
          ./result-ci-checks/sce-release/bin/sce --help
          ./result-ci-checks/sce-release/bin/sce version
          elapsed="$((SECONDS - start))"
          printf 'macOS release CLI smoke: %dm %02ds\n' "$((elapsed / 60))" "$((elapsed % 60))" | tee -a "$GITHUB_STEP_SUMMARY"

