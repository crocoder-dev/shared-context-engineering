version: 1
name: sce-context-load-result

description: >
  Output contract for sce-context-load. The skill returns exactly one YAML
  document representing loaded or bootstrap_required.

output_rules:
  - Return exactly one result variant.
  - The top-level status must be loaded or bootstrap_required.
  - Return YAML only, without a Markdown code fence or explanatory prose.
  - Include only fields belonging to the selected variant.
  - Omit optional fields that do not apply rather than sending them empty.
  - Do not return empty strings or null placeholders. An empty list is a valid
    value for a required list field.
  - List every file that was read, and no file that was not.
  - Report key_facts as durable statements the invoking workflow can act on, not
    as summaries of what a file discusses.
  - Do not include recommendations about how to plan or implement the focus.
  - Do not report context edits. This skill never writes.

variants:

  loaded:
    meaning: >
      The context root exists and the context relevant to the focus was read.

    required_fields:
      - status
      - context_root
      - entry_points
      - domain_context
      - gaps

    optional_fields:
      - drift

    field_rules:
      - List entry_points with the read status of each, including entry points
        that are absent.
      - Include a domain_context entry only for a file that was actually read.
      - Record a gap for any focus area with no durable context, and for any
        absent entry point.
      - Include drift only when recorded context contradicts the code. An
        absence of drift means the checked claims held.
      - An empty domain_context list is valid when the context root exists but
        holds nothing relevant to the focus. Record the gap.

    shape:
      status: loaded

      context_root: string

      entry_points:
        - path: string
          read: true | false
          reason: string

      domain_context:
        - path: string
          relevance: string
          key_facts:
            - string

      gaps:
        - area: string
          detail: string

      drift:
        - path: string
          context_says: string
          code_says: string
          repair_needed: string

    example:
      status: loaded

      context_root: context/

      entry_points:
        - path: context/context-map.md
          read: true
        - path: context/overview.md
          read: true
        - path: context/glossary.md
          read: true
        - path: context/architecture.md
          read: false
          reason: The focus does not change structure, boundaries, or data flow.

      domain_context:
        - path: context/cli/styling-service.md
          relevance: >
            Owns the CLI banner rendering the focus changes.

          key_facts:
            - Color output is gated by a shared supports_color() policy honoring NO_COLOR and TTY detection.
            - The banner gradient is applied per column by services::style.
            - owo-colors is the established styling dependency; no theme configuration surface exists.

        - path: context/cli/cli-command-surface.md
          relevance: >
            Owns which help surfaces render the banner.

          key_facts:
            - The top-level banner is shared by sce, sce help, and sce --help.
            - Command-local help does not render the banner.

      gaps:
        - area: gradient regression coverage
          detail: >
            No durable context records how banner rendering is tested.

      drift:
        - path: context/cli/styling-service.md
          context_says: The banner gradient runs right to left in cyan and magenta.
          code_says: >
            services::style renders a left-to-right red gradient in the current
            working tree.
          repair_needed: >
            Update the styling context to the implemented gradient direction and
            endpoints.

  bootstrap_required:
    meaning: >
      The context root does not exist, so no durable context could be loaded.
      Nothing was read and nothing was created.

    required_fields:
      - status
      - context_root
      - reason

    field_rules:
      - Report context_root as the path that was expected.
      - Do not create the directory. Bootstrapping is owned by
        `sce setup --bootstrap-context`, which the user runs.

    shape:
      status: bootstrap_required

      context_root: string

      reason: string

    example:
      status: bootstrap_required

      context_root: context/

      reason: >
        The repository has no context/ directory, so there is no durable memory
        to load for this focus.
