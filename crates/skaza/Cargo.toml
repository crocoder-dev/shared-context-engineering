[package]
name = "skaza"
version = "0.1.0"
edition = "2021"
description = "Discovery-only Rust mutation candidate finder"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "skaza"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"

[dev-dependencies]
tempfile = "3"
